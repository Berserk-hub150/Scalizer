[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scalizer"
version = "0.1.0"
description = "What-if simulator for microservice autoscaling"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pydantic>=2.0"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "PyJWT[crypto]>=2.10,<3"]
dev = ["pytest>=7", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

